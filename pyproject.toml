[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropcare-ai"
version = "1.0.0"
description = "Crop Disease Detection and Fertilizer Recommendation System Using Machine Learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "[YOUR NAME]", email = "[YOUR EMAIL]"},
]
keywords = [
    "machine-learning",
    "plant-disease-detection",
    "fertilizer-recommendation",
    "agriculture",
    "scikit-learn",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://github.com/vinit-tech-source/CropCare-AI"
Repository = "https://github.com/vinit-tech-source/CropCare-AI"
Issues = "https://github.com/vinit-tech-source/CropCare-AI/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
